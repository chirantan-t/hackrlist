# ===================================================================
# Ansible Inventory - Target Deployment Environments
# ===================================================================

# Localhost simulation (for development, CI runners, and WSL2)
[local]
localhost ansible_connection=local ansible_python_interpreter=/usr/bin/python3

# Staging Environment
[staging]
staging-server.hackathon.internal ansible_host=192.168.1.100 ansible_user=deployuser

# Production Cluster Hosts
[production]
prod-server-01.hackathon.internal ansible_host=10.0.0.50 ansible_user=deployuser

# All Hackathon Deployment Servers Group
[hackathon_servers:children]
local
staging
production

[hackathon_servers:vars]
ansible_ssh_common_args='-o StrictHostKeyChecking=no'
app_directory=/opt/hackathon-team-management-system
release_tag=1.0.0
app_port=8081
