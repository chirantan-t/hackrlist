# ===================================================================
# Ansible Global Group Variables
# ===================================================================

app_name: hackathon-team-management-system
app_dir: /opt/hackathon-team-management-system
deploy_user: deployuser
deploy_group: deploygroup

# Network & Ports
host_port: 8081
server_port: 8080
mysql_internal_port: 3306

# Release Version
image_tag: "1.0.0"
docker_registry: ""

# Database Credentials
mysql_database: hackathondb
mysql_user: hackathon_user
mysql_password: "{{ lookup('env', 'MYSQL_PASSWORD') | default('hackathon_pass', true) }}"
mysql_root_password: "{{ lookup('env', 'MYSQL_ROOT_PASSWORD') | default('root_pass', true) }}"

# Health Check Settings
health_check_url: "http://localhost:{{ host_port }}/actuator/health"
health_check_retries: 15
health_check_delay: 3
