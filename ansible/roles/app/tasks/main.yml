---
# ===================================================================
# Role: app - Application Files & Docker Container Stack Deployment
# ===================================================================

- name: Deploy .env Configuration File from Jinja2 Template
  ansible.builtin.template:
    src: env.j2
    dest: "{{ app_dir }}/.env"
    owner: "{{ deploy_user }}"
    group: "{{ deploy_group }}"
    mode: '0600'

- name: Copy docker-compose.yml to Deployment Target
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../docker-compose.yml"
    dest: "{{ app_dir }}/docker-compose.yml"
    owner: "{{ deploy_user }}"
    group: "{{ deploy_group }}"
    mode: '0644'

- name: Copy Deployment Helper Scripts
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../deployment/scripts/"
    dest: "{{ app_dir }}/scripts/"
    owner: "{{ deploy_user }}"
    group: "{{ deploy_group }}"
    mode: '0755'

- name: Launch or Update Container Stack via Docker Compose
  ansible.builtin.command:
    cmd: docker compose up -d --remove-orphans
    chdir: "{{ app_dir }}"
  environment:
    IMAGE_TAG: "{{ image_tag }}"
    NGINX_PORT: "{{ host_port }}"
  changed_when: true
