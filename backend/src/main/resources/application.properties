# ===================================================================
# Dockerized Hackathon Team Management System - Application Config
# ===================================================================

# Server Port (Configurable, defaults to 8082 to avoid collision with Jenkins on 8080)
server.port=${SERVER_PORT:${APP_PORT:8082}}

# Spring Actuator Configuration
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# Database Configuration with Environment Overrides
# Defaults to in-memory H2 in MySQL mode for instant local development without prerequisites
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:hackathondb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# H2 Console (for debugging when H2 is active)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# Application Seed Data Bootstrap
app.bootstrap.seed-data=true
